[build]
  command = "npm run release:build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/artifacts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/projects/online-retail.html"
  to = "/projects/online-retail/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/online-retail/index.html"
  to = "/projects/online-retail/"
  status = 301
  force = true

